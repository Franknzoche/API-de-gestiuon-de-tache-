# Configuration de démarrage avec PostgreSQL (profil postgres)
# Pour l'utiliser : ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Mets ici les vraies valeurs de ta base PostgreSQL locale.

spring.datasource.url=jdbc:postgresql://localhost:5432/tache_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
